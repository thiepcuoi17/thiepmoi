<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Đang chuyển tiếp...</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, Helvetica, sans-serif;
      color: #252525; background: linear-gradient(135deg, #f5f1eb, #e8edf4);
    }
    .panel {
      width: min(100%, 480px); padding: 34px; text-align: center;
      background: #fff; border: 1px solid #e8e3dc; border-radius: 20px;
      box-shadow: 0 18px 55px rgba(30, 35, 45, .10);
    }
    .mark {
      width: 58px; height: 58px; margin: 0 auto 18px; display: grid;
      place-items: center; border-radius: 18px; color: #fff;
      background: #8b2635; font-size: 28px;
    }
    h1 { margin: 0 0 10px; font-size: 23px; }
    p { color: #686868; line-height: 1.6; margin: 8px 0 18px; }
    .spinner {
      width: 30px; height: 30px; margin: 20px auto;
      border: 3px solid #eee; border-top-color: #8b2635;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    input {
      width: 100%; padding: 13px 14px; border: 1px solid #d8d8d8;
      border-radius: 10px; font-size: 15px; outline: none;
    }
    input:focus { border-color: #8b2635; box-shadow: 0 0 0 3px #8b26351a; }
    button, .go {
      display: inline-block; margin-top: 13px; padding: 12px 20px;
      border: 0; border-radius: 10px; background: #8b2635;
      color: white; font-size: 15px; font-weight: 700; cursor: pointer;
      text-decoration: none;
    }
    button:hover, .go:hover { background: #701d2a; }
    .small { font-size: 12px; color: #999; margin-top: 22px; }
    #manual { display: none; }
    #error { color: #b42318; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark">↗</div>
    <h1 id="heading">Đang chuyển tiếp liên kết</h1>
    <p id="message">Vui lòng chờ trong giây lát, bạn sẽ được chuyển đến trang đích.</p>
    <div class="spinner" id="spinner"></div>
    <a class="go" id="continue" href="#" style="display:none">Tiếp tục truy cập</a>

    <section id="manual">
      <p>Nhập đường dẫn bạn muốn chuyển tiếp đến:</p>
      <input id="destination" type="url" placeholder="https://example.com" autocomplete="url">
      <button id="redirectBtn" type="button">Chuyển tiếp ngay</button>
      <div id="error" role="alert"></div>
    </section>
    <div class="small">Nếu không tự động chuyển trang, hãy chọn nút tiếp tục.</div>
  </main>

  <script>
    // Có thể đặt link mặc định tại đây, ví dụ:
    // const DEFAULT_URL = "https://example.com";
    const DEFAULT_URL = "";

    const params = new URLSearchParams(window.location.search);
    const target = params.get("url") || DEFAULT_URL;

    function validUrl(value) {
      try {
        const parsed = new URL(value);
        return parsed.protocol === "https:" || parsed.protocol === "http:";
      } catch (_) {
        return false;
      }
    }

    function go(value) {
      const clean = value.trim();
      if (!validUrl(clean)) {
        document.getElementById("error").textContent =
          "Đường dẫn không hợp lệ. Hãy nhập link bắt đầu bằng http:// hoặc https://";
        return;
      }
      window.location.replace(clean);
    }

    if (target) {
      if (validUrl(target)) {
        const link = document.getElementById("continue");
        link.href = target;
        link.style.display = "inline-block";
        // Tự động chuyển tiếp sau 1 giây.
        setTimeout(() => window.location.replace(target), 1000);
      } else {
        document.getElementById("heading").textContent = "Link chuyển tiếp không hợp lệ";
        document.getElementById("message").textContent = "Vui lòng kiểm tra lại đường dẫn đích.";
        document.getElementById("spinner").style.display = "none";
      }
    } else {
      document.getElementById("heading").textContent = "Công cụ chuyển tiếp link";
      document.getElementById("message").textContent = "Trang trung gian để chuyển người truy cập đến liên kết bạn cung cấp.";
      document.getElementById("spinner").style.display = "none";
      document.getElementById("manual").style.display = "block";
      document.getElementById("small")?.remove();
    }

    document.getElementById("redirectBtn").addEventListener("click", () => {
      go(document.getElementById("destination").value);
    });
    document.getElementById("destination").addEventListener("keydown", event => {
      if (event.key === "Enter") go(event.target.value);
    });
  </script>
</body>
</html>
